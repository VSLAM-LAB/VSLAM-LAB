[feature.dpvo.dependencies]
dpvo = { version = "*", channel = "https://prefix.dev/vslamlab/vslamlab" }

########################################################################################################################
########################################################################################################################
# orbslam2
[feature.orbslam2]
channels = ["https://prefix.dev/conda-forge", "https://prefix.dev/vslamlab/vslamlab"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[feature.orbslam2.tasks]
fetch-source = 'git clone https://huggingface.co/vslamlab/orbslam2-vslamlab Baselines/ORB-SLAM2'
execute-mono = 'vslamlab_orbslam2_mono'
execute-rgbd = 'vslamlab_orbslam2_rgbd'
execute-stereo = 'vslamlab_orbslam2_stereo'

[feature.orbslam2.dependencies]
orbslam2 = { version = "*", channel = "https://prefix.dev/vslamlab/vslamlab" }

########################################################################################################################
########################################################################################################################
# colmap
[feature.colmap]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64-cuda129", "osx-arm64-cuda129", "win-64-cuda129"]

[feature.colmap.tasks]
fetch-source = { cmd = 'git clone https://github.com/VSLAM-LAB/COLMAP-VSLAM-LAB colmap', cwd = 'Baselines' }
execute-mono = 'python Baselines/colmap/vslamlab_colmap.py'
# Pre-warm COLMAP's download cache (~/.cache/colmap: ALIKED / LightGlue / LoMa ONNX models and the FAISS vocabulary
# trees for sequential loop detection) before running on nodes without internet; COLMAP fetches on demand otherwise.
download-colmap-models = 'python Baselines/colmap/download_colmap_models.py'

[feature.colmap.dependencies]
numpy = "*"
scipy = "*"
pandas = "*"
pyyaml = "*"
# The conda-forge colmap package links libOpenImageIO.so.3.1 but does not declare openimageio as a
# run dependency, so an unpinned solve drifts to 3.2 and `colmap` fails to start (missing .so.3.1).
libopenimageio = "3.1.*"

[feature.colmap.target.linux-64.dependencies]
colmap = {version="=4.2.1", build = "*cuda*" }
# The conda-forge onnxruntime-cpp CUDA build (ALIKED / LightGlue feature types) dlopens libcudnn.so
# at runtime without declaring it; without this the ALIKED feature_extractor aborts with
# "cuDNN is unavailable or disabled for CUDA Execution Provider".
libcudnn = "*"

[feature.colmap.target.osx-arm64.dependencies]
colmap = "=4.2.1"

[feature.colmap.target.win-64.dependencies]
colmap = {version="=4.2.1", build = "*cuda*" }

########################################################################################################################
########################################################################################################################
# orbslam3
[feature.orbslam3]
channels = ["https://prefix.dev/conda-forge", "https://prefix.dev/vslamlab/vslamlab"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[feature.orbslam3.tasks]
