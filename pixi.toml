platforms = ["linux-64-cuda", "linux-64-cuda129"]

# TORCH_HOME: DISK/LightGlue weights of the classic loop closure (loop_closure: 2) are downloaded there by torch.hub
[feature.dpvo.tasks]
fetch-source = 'git clone https://huggingface.co/vslamlab/dpvo-vslamlab Baselines/DPVO'
