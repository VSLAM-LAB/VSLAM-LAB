[workspace]
name = "VSLAM-LAB"
version = "0.1.0"
description = "VSLAM-LAB"
channels = ["https://prefix.dev/conda-forge"]
platforms = [
    "linux-64", "osx-arm64", "win-64",
    { name = "linux-64-cuda", platform = "linux-64", cuda = "12.6" },
    { name = "osx-arm64-cuda", platform = "osx-arm64", cuda = "12.6" },
    { name = "win-64-cuda", platform = "win-64", cuda = "12.6" },
    { name = "linux-64-cuda129", platform = "linux-64", cuda = "12.9" },
    { name = "osx-arm64-cuda129", platform = "osx-arm64", cuda = "12.9", macos = "13.3" },  # macos: colmap 4.2.1 -> libfaiss 1.14.3 needs __osx >= 13.3 (only the colmap feature uses this entry)
    { name = "win-64-cuda129", platform = "win-64", cuda = "12.9" },
]

[activation.env]
# Regex matched against full command lines: defines what counts as a VSLAM-LAB job
# for list-jobs and kill-all, so the two always agree.
VSLAMLAB_JOBS_PATTERN = "mapanything|droidslam|dpvo|mast3rslam|monogs|orbslam2|orbslam3|allfeature|okvis2|colmap|vpr-lab|vggt|pycuvslam|vslamlab"

[tasks]
clean-swap = { cmd = "sudo /sbin/swapoff -a && sudo /sbin/swapon -a" }
kill-all = { cmd = "pkill -f -e $VSLAMLAB_JOBS_PATTERN && sudo /sbin/swapoff -a && sudo /sbin/swapon -a" }

# VGGT-1B weights (5 GB) shared by vggtslam, vggtslam-dev and mapanything's vggt module. The vggtslam entry
# points fetch them with torch.hub.load_state_dict_from_url, which neither resumes nor checks the byte count,
# so a dropped connection leaves a truncated model.pt that every later run trips over. `hf download` resumes
# and verifies; the execute tasks depend on this and point TORCH_HOME at the same folder so torch.hub finds
# the file already in place (mapanything does the same download itself, only when its vggt module runs).
# Pixi skips it once the output exists (and re-runs if it changes).
download-vggt-weights = { cmd = "hf download facebook/VGGT-1B model.pt --local-dir Baselines/torch_home/hub/checkpoints", outputs = ["Baselines/torch_home/hub/checkpoints/model.pt"] }

[environments]
vslamlab = { features = ["vslamlab", "development"] }
cuda129 = { features = ["cuda129"], solve-group = "cuda129" }
py10 = { features = ["py10"], solve-group = "py10" }
py11 = { features = ["py11"], solve-group = "py11" }

mast3rslam = { features = ["mast3rslam"], solve-group = "mast3r" }
droidslam = { features = ["droidslam"], solve-group = "droid" }
dpvo = { features = ["dpvo"], solve-group = "dpvo" }
orbslam2 = { features = ["orbslam2"] }
allfeature = { features = ["allfeature"] }
colmap = { features = ["colmap"], solve-group = "colmap" }
orbslam3 = { features = ["orbslam3"] }
okvis2 = { features = ["okvis2"] }
pycuvslam = { features = ["pycuvslam"] }
vggtslam = { features = ["vggtslam"], solve-group = "vggt" }
mapanything = { features = ["mapanything"] }

mast3rslam-dev = { features = ["mast3rslam-dev"] }
droidslam-dev = { features = ["droidslam-dev"] }
dpvo-dev = { features = ["dpvo-dev"] }
monogs-dev = { features = ["monogs-dev"] }
orbslam2-dev = { features = ["orbslam2-dev"] }
orbslam3-dev = { features = ["orbslam3-dev"] }
okvis2-dev = { features = ["okvis2-dev"] }
vggtslam-dev = { features = ["vggtslam-dev"] }

allfeature-dev = { features = ["allfeature-dev"] }

da3 = { features = ["da3"] }
da3-streaming = { features = ["da3-streaming"] }
mask2former = { features = ["mask2former"] }
fastfoundationstereo = { features = ["fastfoundationstereo"] }
anycalib = { features = ["anycalib"] }
vpr-lab = { features = ["vpr-lab"] }
refrax = { features = ["refrax"] }
placecell = { features = ["placecell"] }

ros1 = { features = ["ros1"], solve-group = "ros1" }
ros2 = { features = ["ros2"], solve-group = "ros2" }
rerun = { features = ["rerun"], solve-group = "rerun" }
projectaria = { features = ["projectaria"] }

# VSLAM-LAB main pipeline
[feature.vslamlab]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[feature.vslamlab.tasks]
vslamlab.cmd = "python vslamlab_gui.py vslamlab {{ exp_yaml }} {{ overwrite }}"
vslamlab.args = [
  { "arg" = "exp_yaml", "default" = "configs/exp_vslamlab.yaml" },
  { "arg" = "overwrite", "default" = " " },
]

evaluate.cmd = "python vslamlab_gui.py evaluate_exp {{ exp_yaml }} {{ overwrite }}"
evaluate.args = [
  { "arg" = "exp_yaml", "default" = "configs/exp_debug.yaml" },
  { "arg" = "overwrite", "default" = " " },
]

compare.cmd = "python vslamlab_gui.py compare_exp {{ exp_yaml }}"
compare.args = [
  { "arg" = "exp_yaml", "default" = "configs/exp_debug.yaml" }
]

get-resources.cmd = "python vslamlab_gui.py get-resources {{ exp_yaml }}"
get-resources.args = [
  { "arg" = "exp_yaml", "default" = "configs/exp_vslamlab.yaml" }
]

vslamlab-debug.depends-on = [{ "task" = "vslamlab", "args" = ["configs/exp_debug.yaml", "--overwrite"] }]
vslamlab-allfeature = [{ "task" = "vslamlab", "args" = ["configs/exp_allfeature.yaml", "--overwrite"] }]
demo = "python vslamlab_gui.py demo"

premerge-smoke.cmd = "python vslamlab_gui.py vslamlab configs/premerge-smoke/exp_premerge_smoke_{{ mode }}.yaml {{ overwrite }}"
premerge-smoke.args = [
  { "arg" = "mode", "default" = "stereo" },
  { "arg" = "overwrite", "default" = "--overwrite" },
]

evaluate-debug.depends-on = [{ "task" = "evaluate", "args" = ["configs/exp_debug.yaml", "--overwrite"] }]
evaluate-allfeature = [{ "task" = "evaluate", "args" = ["configs/exp_allfeature.yaml", "--overwrite"] }]
compare-debug.depends-on = [{ "task" = "compare", "args" = ["configs/exp_debug.yaml"] }]
compare-allfeature = [{ "task" = "compare", "args" = ["configs/exp_allfeature.yaml"] }]

# VSLAM-LAB info functions
baseline-info = "python vslamlab_gui.py baseline_info"
print-baselines = "python vslamlab_gui.py print_baselines"
print-datasets = "python vslamlab_gui.py print_datasets"
list-jobs = "python vslamlab_gui.py list_jobs"
kill-job = "python vslamlab_gui.py kill_job"
kill-jobs = "python vslamlab_gui.py kill_jobs"
generate-dataset-table = "python Datasets/extra-files/generate_dataset_table.py"
generate-dataset-xlsx = "python Datasets/extra-files/generate_dataset_xlsx.py"
set-benchmark-path  = "python path_constants.py set_VSLAMLAB_BENCHMARK_path"
set-evaluation-path = "python path_constants.py set_VSLAMLAB_EVALUATION_path"

# VSLAM-LAB pipeline functions
validate-experiment-yaml = "python vslamlab_gui.py validate_experiment_yaml"
overwrite-exp = "python vslamlab_gui.py overwrite_exp"
update-experiment-csv-logs = "python vslamlab_gui.py update_experiment_csv_logs"

check-experiment-resources = "python vslamlab_gui.py check_experiment_resources"
get-experiment-resources = "python vslamlab_gui.py get_experiment_resources"

check-experiment-state = "python vslamlab_gui.py check_experiment_state"

install-baseline = "python vslamlab_gui.py install_baseline"
install-baselines = "python vslamlab_gui.py install_baselines"

download-sequence = "python vslamlab_gui.py download_sequence"
download-sequences = "python vslamlab_gui.py download_sequences"
download-dataset = "python vslamlab_gui.py download_dataset"

synch-gt = "python Datasets/extra-files/synch_gt.py"
sample-vpr = "python Datasets/extra-files/sample_vpr.py"
label-sequences = "python Gym/label_sequences.py"
select-sequences = "python Gym/select_sequences.py"

run-exp = "python vslamlab_gui.py run_exp"
evaluate-exp = "python vslamlab_gui.py evaluate_exp"
compare-exp = "python vslamlab_gui.py compare_exp"

# Capabilities: the driver resolves dataset/sequence targets and runs the capability repo in its own environment
stereo-inference = "python Capabilities/fastfoundationstereo.py"
mask-inference = "python Capabilities/mask2former.py"
calib-inference = "python Capabilities/anycalib.py"
depth-inference = "python Capabilities/depth_anything.py"
placecell-select = "python Capabilities/placecell.py"
refrax-inference = "python Capabilities/refrax.py"
vpr = "python Capabilities/vpr.py"

[feature.vslamlab.dependencies]
python = "3.13.*"
pyyaml = "*"
matplotlib = "*"
pandas = "*"
py-opencv = "*"
scipy = "*"
h5py = "*"
requests = "*"
inputimeout = "*"
scikit-learn = "*"
tqdm = "*"
google-api-python-client = "*"
google-auth-oauthlib = "*"
huggingface_hub = "*"
py7zr = "*"
exifread = "*"
pyproj = "*"
nvidia-ml-py = "*"
evo = "==1.34.3"
git-lfs = "*"
piexif = "*"
psutil = "*"
