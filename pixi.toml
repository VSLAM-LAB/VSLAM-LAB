execute-mono = 'vslamlab_orbslam3_mono'
execute-rgbd = 'vslamlab_orbslam3_rgbd'
execute-stereo = 'vslamlab_orbslam3_stereo'
execute-mono-vi = 'vslamlab_orbslam3_mono_vi'
execute-rgbd-vi = 'vslamlab_orbslam3_rgbd_vi'
execute-stereo-vi = 'vslamlab_orbslam3_stereo_vi'

[feature.orbslam3.dependencies]
orbslam3 = { version = "*", channel = "https://prefix.dev/vslamlab/vslamlab" }

########################################################################################################################
########################################################################################################################
# okvis2
[feature.okvis2]
channels = ["https://prefix.dev/conda-forge", "https://prefix.dev/vslamlab/vslamlab"]
platforms = ["linux-64"]

[feature.okvis2.tasks]
fetch-source = 'git clone https://huggingface.co/vslamlab/okvis2-vslamlab Baselines/OKVIS2'
execute-mono-vi = 'vslamlab_okvis2_mono_vi'

[feature.okvis2.dependencies]
okvis2 = { version = "*", channel = "https://prefix.dev/vslamlab/vslamlab" }

########################################################################################################################
########################################################################################################################
# pycuvslam
[feature.pycuvslam]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64-cuda"]

# cuVSLAM is closed source: NVIDIA publishes the Python wheel (with its own CUDA runtime) on the GitHub releases of
# nvidia-isaac/cuVSLAM, installed from there below. The clone only provides the VSLAM-LAB entry scripts and settings
# (github.com/VSLAM-LAB/pycuvslam).
[feature.pycuvslam.tasks]
fetch-source = './git-clone.sh VSLAM-LAB pycuvslam PyCuVSLAM'
execute-rgbd = { cmd = 'python vslamlab_pycuvslam_rgbd.py', cwd = 'Baselines/PyCuVSLAM' }
execute-stereo = { cmd = 'python vslamlab_pycuvslam_stereo.py', cwd = 'Baselines/PyCuVSLAM' }
execute-stereo-vi = { cmd = 'python vslamlab_pycuvslam_stereo_vi.py', cwd = 'Baselines/PyCuVSLAM' }

[feature.pycuvslam.dependencies]
python = "3.10.*"  # cp310 wheel: the cp312 ones need glibc >= 2.39 (manylinux_2_39)
numpy = "*"
pandas = "*"
scipy = "*"
pillow = "*"
pyyaml = "*"
rerun-sdk = "0.22.*" # viewer (verbose: 1); the scripts use rr.set_time_sequence and rr.Scalar (renamed in later rerun)
# The wheel bundles libcudart 12.6 but links the CUDA 12 math libraries from the system/environment
cuda-version = "12.6.*"
libcublas = "*"
libcusolver = "*"
libcusparse = "*"

# The wheel's libraries only search their own folder (RPATH $ORIGIN): find the CUDA libraries in the environment
[feature.pycuvslam.activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"

[feature.pycuvslam.pypi-dependencies]
cuvslam = { url = "https://github.com/nvidia-isaac/cuVSLAM/releases/download/v17.0.0/cuvslam-17.0.0%2Bcu12-cp310-cp310-manylinux_2_35_x86_64.whl" }

########################################################################################################################
########################################################################################################################
# vggtslam
[feature.vggtslam]
channels = ["https://prefix.dev/conda-forge", "https://prefix.dev/vslamlab/vslamlab"]
platforms = ["linux-64-cuda", "linux-64-cuda129"]

[feature.vggtslam.dependencies]
# noarch package (github.com/VSLAM-LAB/vggtslam) with VGGT-SLAM's full runtime dependency set (gtsam >=4.3 from
# conda-forge); python is pinned here like in the other environments
vggtslam = { version = "*", channel = "https://prefix.dev/vslamlab/vslamlab" }
python = "3.11.*"

[feature.vggtslam.tasks]
fetch-source = 'git clone https://huggingface.co/vslamlab/vggtslam-vslamlab Baselines/VGGT-SLAM'
# TORCH_HOME: VGGT-1B weights pre-fetched by download-vggt-weights (see [tasks]); SALAD/DINOv2 land there too
execute-mono = { cmd = 'vslamlab_vggtslam_mono', cwd = "Baselines/VGGT-SLAM", env = { TORCH_HOME = "$PIXI_PROJECT_ROOT/Baselines/torch_home" }, depends-on = ["download-vggt-weights"] }

# ########################################################################################################################
# mapanything: MapAnything plus the feed-forward models its model factory hosts (vggt, vggt-omega, pi3, pi3x, dust3r,
# mast3r, must3r, pow3r), selected per experiment with the `module` parameter of the single `mapanything` baseline
[feature.mapanything]
platforms = ["linux-64"]

# Tasks forward to the clone's own pixi.toml (github.com/VSLAM-LAB/mapanything), whose environment lives in
# Baselines/MapAnything/.pixi (MapAnything is installed from the checkout, not published as a package). Run tasks use
# --frozen so only `install` re-solves that environment.
[feature.mapanything.tasks]
fetch-source = "./git-clone.sh VSLAM-LAB mapanything MapAnything"
install = { cmd = "pixi run install", cwd = "Baselines/MapAnything" }
execute-mono = { cmd = "pixi run --frozen execute-mono", cwd = "Baselines/MapAnything" }
execute-rgbd = { cmd = "pixi run --frozen execute-rgbd", cwd = "Baselines/MapAnything" }

