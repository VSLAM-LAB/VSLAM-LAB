dataset_name: dataset_name_template

rgb_hz: 30.0

# Closed list (SKILL.md step 1) - every value must already appear in the Modes column of
# Datasets/extra-files/dataset_table.md (regenerate via generate_dataset_table.py first; read
# live since the set can grow - as of this writing: mono, mono-vi, rgbd, rgbd-vi, stereo,
# stereo-vi). The derivation rule (include the native mode(s) *and* every mode derivable by
# dropping a channel) and per-value meanings are canonical in
# Datasets/extra-files/closed_lists.md#modes-modes. Not repeated here.
modes: ['mono', 'rgbd']

# Closed list (SKILL.md step 1) - every value must already appear in the Camera Models column of
# Datasets/extra-files/dataset_table.md (same regenerate-first, read-live rule as modes above -
# as of this writing: equid4, pinhole, radtan4, radtan5, unknown). The value must describe what
# create_calibration_yaml actually writes, not just "this is a perspective camera" - the
# pinhole/radtan/unknown mapping and per-value Model: citations are canonical in
# Datasets/extra-files/closed_lists.md#camera-models-cam_models; gotchas for getting this wrong are
# in dataset_template.py's create_calibration_yaml WARNINGS. Not repeated here.
cam_models: ['pinhole']

# Closed list (SKILL.md step 1) - every value must already appear in the Raw Format column of
# Datasets/extra-files/dataset_table.md (same regenerate-first, read-live rule as modes/cam_models
# above - as of this writing: zip, tar, 7z, ros1, ros2, images, video, colmap, hdf5, local). Not
# the same axis as url_download_root/hf_repo_id/etc. below - that's the download *transport*, this
# is the payload's *packaging* once fetched, and the two vary independently. The per-value
# breakdown and Model: citations are canonical in
# Datasets/extra-files/closed_lists.md#raw-format-raw_formats. Not repeated here.
raw_formats: ['zip']

# The field below is for the "website"/"google-drive"/"api" download patterns (SKILL.md step 1) -
# replace it entirely with whichever field matches this dataset's actual source. Field name/shape
# per pattern (canonical here - the fetch mechanism and Model: citations are canonical in
# Datasets/extra-files/closed_lists.md#download-type-download, not repeated here):
#   website      -> url_download_root: a root URL + filename pattern serving whatever raw_formats
#                   above names, or a dict keyed by group prefix when several sequences share one
#                   of a few group-level archives (see dataset_euroc.yaml's MH_/V1_/V2_ prefixes),
#                   or by full sequence_name when there's no sharing at all. Also the right field
#                   for a *pre-resolved* drive.usercontent.google.com direct-download URL (see
#                   dataset_tartanair.yaml) - don't confuse with the google-drive case below.
#   hugging-face -> hf_repo_id: "org/name" (see dataset_soneva.yaml/dataset_sweetcorals.yaml)
#   google-drive -> google_drive_link: a real drive.google.com share link - if a plain HTTP GET
#                   works on the URL instead, it's website (url_download_root), not this.
#   api          -> api_url: the API's base URL - its own field, not shared with url_download_root,
#                   so generate_dataset_table.py can tell api and website apart (see dataset_sesoko.yaml).
#                   See api_token below if the API needs auth.
#   local        -> no field here; affected sequences carry sequence_location: local instead
#                   (a list with one entry per sequence_names, same order, if only some
#                   sequences are local; a single scalar if all are - see
#                   dataset_strayscanner.yaml)
url_download_root: ""

# Optional. Only for an "api" pattern (or any other download needing token auth) - read in
# __init__ as self.api_token = self.cfg.get("api_token", "not_set"), never cfg["api_token"] (a
# missing token should surface as get_download_issues' "api_token" issue, not a KeyError at load
# time). Delete this line entirely if the download needs no auth. See dataset_sesoko.yaml/
# dataset_madmax.yaml.
# api_token: ""

# Optional. Set when resize (SKILL.md step 1) is true, i.e. source images are bigger than
# 640x480 — create_rgb_folder then downscales to match this target's pixel area while preserving
# aspect ratio. Delete this line (now or later) to fall back to copying images at their original
# resolution instead — no code change needed, __init__ reads this with .get(), defaulting to None.
# See dataset_sweetcorals.yaml.
# If this is set and the dataset writes real focal_length/principal_point, create_calibration_yaml
# must rescale them to match — see dataset_template.py's create_calibration_yaml comment and
# utilities.scale_intrinsics. Forgetting this was VSLAM-LAB issue #99.
target_resolution: [640, 480]

sequence_names:
  - sequence_01
  - sequence_02

# authors: the dataset's original creators/publishers, not the vslamlab_maintainer below (the
# person/agent who integrated it into VSLAM-LAB) — see dataset_eth.yaml for a real example.
#
# access/publication/year/bibtex_key/bibtex below are all optional bibliography fields, read by
# Datasets/extra-files/generate_dataset_xlsx.py (nothing at runtime consumes them). Omit any you
# don't have yet - blank cells in the generated spreadsheet are expected and get filled in over
# time, not something to guess at import time.
about:
  license: CC-BY-4.0
  summary: One-line description of the dataset
  homepage: https://example.com/dataset
  # Closed list (README.md's legend, right below the Datasets table) - exactly one of Real/
  # Synthetic, one or more of Indoor/Outdoor/Underwater/Intracorporeal, and one or more of
  # Handheld/Headmounted/Vehicle/UAV/Robot. Construction Site/Planetary-analog Terrain are
  # section-divider labels only (grouping several datasets in the README table under one
  # <hr>-separated heading) - never tag an individual dataset with them. This is the word form of
  # the same tags README.md shows as emoji (📸🏠🤳 etc.) for this dataset's row - keep both in sync
  # if either changes.
  features:
    - Real
    - Indoor
    - Handheld
  authors:
    - Author Name
    - Another Author
  # access: Public                    # e.g. Public / Private - omit if unknown, don't assume Public
  # publication: Paper title as published
  # year: 2024
  # bibtex_key: schops2019bad         # citation key used in bibtex below
  # bibtex: |
  #   @inproceedings{schops2019bad,
  #     title={...},
  #     author={...},
  #     year={2019}
  #   }

vslamlab_maintainer:
  name: Maintainer Name
  # If an AI coding agent (Claude, Copilot, etc.) helped write this dataset's files, credit it
  # here alongside the human maintainer — set to None if no agent was involved.
  assisted_by: Claude (Sonnet 5)   # e.g. None
  email: maintainer@example.com
  date: YYYY-MM-DD
