dataset_name: dataset_name_template

rgb_hz: 30.0

# Closed list (SKILL.md step 1) - every value must already appear in the Modes column of
# Datasets/extra-files/dataset_table.md (regenerate via generate_dataset_table.py first; read
# live since the set can grow - as of this writing: mono, mono-vi, rgbd, rgbd-vi, stereo,
# stereo-vi). Include the native mode(s) *and* every mode derivable by dropping a channel:
#   stereo/rgbd -> mono (one image of the pair / drop depth - stereo and rgbd don't reduce to
#                  each other)
#   -vi         -> non-vi (drop the IMU stream - one-way only, never invent IMU data)
# e.g. native stereo-vi -> ['mono', 'mono-vi', 'stereo', 'stereo-vi']; plain stereo ->
# ['mono', 'stereo']; plain mono -> ['mono'].
modes: ['mono', 'rgbd']

# Closed list (SKILL.md step 1) - every value must already appear in the Camera Models column of
# Datasets/extra-files/dataset_table.md (same regenerate-first, read-live rule as modes above -
# as of this writing: equid4, pinhole, radtan4, radtan5, unknown). The value describes the actual
# calibration create_calibration_yaml writes, not just "this is a perspective camera":
#   pinhole             -> zero distortion - focal_length/principal_point only, no distortion_type/
#                          distortion_coefficients fields at all. Model: dataset_eth.yaml.
#   radtan4/radtan5/    -> pinhole + that distortion model's real, trusted distortion_coefficients.
#   equid4                 Model: dataset_eiffel-tower.yaml (radtan4).
#   unknown             -> no verified calibration exists at all - zero focal_length/
#                          principal_point, no distortion fields. Model: dataset_sweetcorals.yaml's
#                          non-pinhole sequences.
# Get this wrong and dataset_table.md's Camera Models column (and anything relying on it) silently
# misreports the calibration's actual trustworthiness - dataset_sesoko.yaml once declared
# cam_models: ['pinhole'] while its create_calibration_yaml wrote real radtan4 distortion
# coefficients, caught and fixed only in a later cleanup pass.
cam_models: ['pinhole']

# The field below is for the "website"/"google-drive"/"api" download patterns (SKILL.md step 1) -
# replace it entirely with whichever field matches this dataset's actual source:
#   website      -> url_download_root: a root URL + filename pattern serving a .zip/.tar/.7z. This
#                   is also the right field for a *pre-resolved* drive.usercontent.google.com
#                   direct-download URL - it downloads exactly like any other website URL (plain
#                   utilities.downloadFile, no gdown), even though it happens to be hosted on
#                   Google Drive - see dataset_tartanair.yaml. Can also be a dict instead of a
#                   plain string, keyed by whichever granularity actually applies: by group prefix
#                   when several sequences share one of a few group-level archives - see
#                   dataset_euroc.yaml (MH_/V1_/V2_ prefixes, each mapping to that group's archive
#                   URL); by full sequence_name when every sequence has its own genuinely unrelated
#                   URL and there's no sharing at all (i.e. the group-prefix case with group size 1).
#   hugging-face -> hf_repo_id: "org/name" (see dataset_soneva.yaml/dataset_sweetcorals.yaml)
#   google-drive -> google_drive_link: a real drive.google.com share link. Drive shows a
#                   virus-scan interstitial for most files this size that a plain download can't
#                   click through - download_sequence_data must use gdown.download/
#                   gdown.download_folder against this field instead, see
#                   dataset_hilti2026.yaml/dataset_drunkards.yaml. Don't confuse this with the
#                   pre-resolved-link case above - if in doubt, try the URL with a plain HTTP GET
#                   first; if that works, it's website (url_download_root), not this.
#   api          -> url_download_root: the API's base URL (same field as website, reused since it
#                   genuinely is one) - see api_token below if the API needs auth. Unlike website,
#                   download_sequence_data fetches via paginated JSON requests, not
#                   downloadFile/decompressFile - see dataset_sesoko.yaml/dataset_squidle.py.
#   local        -> no field here; affected sequences carry sequence_location: local instead
#                   (a list with one entry per sequence_names, same order, if only some
#                   sequences are local; a single scalar if all are - see
#                   dataset_strayscanner.yaml)
url_download_root: ""

# Optional. Only for an "api" pattern (or any other download needing token auth) - read in
# __init__ as self.api_token = self.cfg.get("api_token", "not_set"), never cfg["api_token"] (a
# missing token should surface as get_download_issues' "api_token" issue, not a KeyError at load
# time). Delete this line entirely if the download needs no auth. See dataset_sesoko.yaml/
# dataset_madmax.yaml.
# api_token: ""

# Optional. Set when resize (SKILL.md step 1) is true, i.e. source images are bigger than
# 640x480 — create_rgb_folder then downscales to match this target's pixel area while preserving
# aspect ratio. Delete this line (now or later) to fall back to copying images at their original
# resolution instead — no code change needed, __init__ reads this with .get(), defaulting to None.
# See dataset_sweetcorals.yaml.
target_resolution: [640, 480]

sequence_names:
  - sequence_01
  - sequence_02

# authors: the dataset's original creators/publishers, not the vslamlab_maintainer below (the
# person/agent who integrated it into VSLAM-LAB) — see dataset_eth.yaml for a real example.
about:
  license: CC-BY-4.0
  summary: One-line description of the dataset
  homepage: https://example.com/dataset
  authors:
    - Author Name
    - Another Author

vslamlab_maintainer:
  name: Maintainer Name
  # If an AI coding agent (Claude, Copilot, etc.) helped write this dataset's files, credit it
  # here alongside the human maintainer — set to None if no agent was involved.
  assisted_by: Claude (Sonnet 5)   # e.g. None
  email: maintainer@example.com
  date: YYYY-MM-DD
