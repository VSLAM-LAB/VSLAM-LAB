  summary: GrandTour (Alphasense rig) - 48 ANYmal-D quadruped missions across alpine, forest, urban, industrial, construction and indoor sites with the Boxi payload, here the hardware-synchronized Sevensense Alphasense front monochrome stereo pair (1440x1080 at 10 Hz) and its BMI085 IMU, with post-processed RTK-GNSS/INS 6-DoF poses and Leica MS60 total-station prism positions as groundtruth
  homepage: https://grand-tour.leggedrobotics.com/
  features:
