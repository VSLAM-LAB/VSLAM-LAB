dataset_name: euroc

rgb_hz: 20.0
imu_hz: 200.0
modes: ['mono', 'stereo', 'mono-vi', 'stereo-vi']
cam_models: ['radtan4']

# Shared per-group archive root, one URL per EuRoC sequence group (see dataset_euroc.py's
# _GROUP_INFO, which maps the same prefixes to each group's subfolder name/download size).
url_download_root:
  MH_: "https://www.research-collection.ethz.ch/server/api/core/bitstreams/7b2419c1-62b5-4714-b7f8-485e5fe3e5fe/content"
  V1_: "https://www.research-collection.ethz.ch/server/api/core/bitstreams/02ecda9a-298f-498b-970c-b7c44334d880/content"
  V2_: "https://www.research-collection.ethz.ch/server/api/core/bitstreams/ea12bc01-3677-4b4c-853d-87c7870b8c44/content"

url_download_root_gt: "https://cvg.cit.tum.de/mono/supp_v2.zip"

sequence_names:
  - MH_01_easy
  - MH_02_easy
  - MH_03_medium
  - MH_04_difficult
  - MH_05_difficult
  - V1_01_easy
  - V1_02_medium
  - V1_03_difficult
  - V2_01_easy
  - V2_02_medium
  - V2_03_difficult

about:
  license: Not explicitly stated (research/academic use)
  summary: EuRoC MAV visual-inertial dataset with stereo images, IMU, and ground-truth trajectories from a micro aerial vehicle
  homepage: https://projects.asl.ethz.ch/datasets/euroc-mav/
  authors:
    - Michael Burri
    - Janosch Nikolic
    - Pascal Gohl
    - Thomas Schneider
    - Joern Rehder
    - Sammy Omari
    - Markus W. Achtelik
    - Roland Siegwart

