dataset_name: fomo

# Nominal ZED X rate. Measured on red_2024-11-21-10-34: 2537 frames over 253.9 s (10.0 Hz average)
# but with jittery driver-side stamps (63 to 138 ms between consecutive frames).
rgb_hz: 10.0
modes: ['mono', 'mono-vi', 'stereo', 'stereo-vi']
cam_models: ['pinhole']
raw_formats: ['images']
target_resolution: [640, 480]

# The dataset website's "Download" button only generates an `aws s3 sync s3://fomo-dataset/...
# --no-sign-request` script: the data lives in a public, anonymous S3 bucket laid out as
# data/<deployment YYYY-MM-DD>/<recording>/<sensor>/<timestamp_us>.png. Every object is a plain
# HTTPS GET and the bucket allows anonymous ListObjectsV2, so no AWS CLI, credentials or boto3 are
# needed. Only the ZED X pair (zedx_left/, zedx_right/), calib/, gt.txt and the two IMU CSVs are
# fetched per recording - the lidars, radar, audio and the rear Basler camera are left on the
# server (the ZED pair alone is 10 to 160 GB per recording).
url_download_root: "https://fomo-dataset.s3.amazonaws.com/data/"

# Recording folders exactly as the bucket names them: <trajectory>_<YYYY-MM-DD-HH-MM>, grouped
# under the deployment folder of their (first) day. Two week-long deployments hold recordings
# dated after their folder (2025-01-30 under 2025-01-29, 2025-03-14 under 2025-03-10) - see
# dataset_fomo.py. The six trajectories are the Red (~300 m on-road loop), Blue (~550 m), Green
# (~700 m off-trail, steep), Magenta (~700 m off-trail, quarry), Yellow (~1.9 km forest road) and
# Orange (~2.5 km forest road through a stone quarry) routes, repeated across 12 deployments from
# November 2024 to November 2025; missing combinations were never recorded (ski-season access
# restrictions, battery failures). red_2025-04-15-51-56 is kept verbatim despite its odd time.
