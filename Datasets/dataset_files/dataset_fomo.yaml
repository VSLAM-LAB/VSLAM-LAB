about:
  license: CC BY 4.0 (per the LICENSE.txt shipped in the data bucket; the dataset website states CC BY-SA 4.0)
  summary: FoMo (Forêt Montmorency) - a Clearpath Warthog UGV repeating six on-road, forest-road and off-trail trajectories through a boreal forest over 12 deployments across one year (snow accumulation above 1 m, mud, vegetation growth), here the front-facing Stereolabs ZED X color stereo pair (factory-rectified 1920x1200 at 10 Hz) and the VectorNav VN100 IMU, with PPK-GNSS fused positions as groundtruth
  homepage: https://fomo.norlab.ulaval.ca/
  features:
    - Real
    - Outdoor
    - Robot
  authors:
    - Matěj Boxan
    - Gabriel Jeanson
    - Alexander Krawciw
    - Effie Daum
    - Xinyuan Qiao
    - Sven Lilge
    - Timothy D. Barfoot
    - François Pomerleau
  access: Public
  publication: "FoMo: A Multi-Season Dataset for Robot Navigation in Forêt Montmorency"
  publication_url: "https://arxiv.org/abs/2603.08433"
  year: 2026
