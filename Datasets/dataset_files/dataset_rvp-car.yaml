dataset_name: rvp-car

rgb_hz: 20.0
modes: ['mono', 'mono-vi', 'stereo', 'stereo-vi']
cam_models: ['radtan4']
raw_formats: ['ros1']

url_download_root: "http://srrg.diag.uniroma1.it/vbr_slam"

target_resolution: [640, 480]

sequence_names:
  - campus_test1
  - campus_test0
  - campus_train0
  - campus_train1
  - ciampino_test1
  - ciampino_test0
  - ciampino_train1
  - ciampino_train0

