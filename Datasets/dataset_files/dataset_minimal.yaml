  license: CC-BY-4.0
  summary: Minimal Texture Dataset for RGB-D SLAM - RealSense D435i RGB-D sequences over low-texture conceptual-geometry and sand scenes (DLR), with millimeter-accurate Vicon ground truth
  homepage: https://www.dlr.de/en/rm/research/publications-and-downloads/datasets/minimal-texture-dataset-for-rgb-d-slam
  features:
    - Real
    - Indoor
    - Handheld
  authors:
