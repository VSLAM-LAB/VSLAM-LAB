    - Javier Civera
  access: Public
  publication: "SID-SLAM: Semi-Direct Information-Driven RGB-D SLAM"
  publication_url: "https://ieeexplore.ieee.org/document/10058038"
  year: 2023
  bibtex_key: fontan2023sid
  bibtex: |
    @article{fontan2023sid,
      title={{SID-SLAM}: Semi-Direct Information-Driven {RGB-D SLAM}},
