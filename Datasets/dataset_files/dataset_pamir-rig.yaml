dataset_name: pamir-rig

rgb_hz: 30.0
modes: ['mono', 'mono-vi', 'stereo', 'stereo-vi']
cam_models: ['unknown']

hf_repo_id: "afrl-uw/Pamir_Visual-Inertial_Data"

target_resolution: [640, 480]

# 2024_OnRig merges the source's separately-recorded 2024_LeftOnRig/2024_RightOnRig bags into one
# stereo(-vi) sequence: both cameras were rigidly mounted with overlapping fields of view and
# their bags start within ~2ms of each other with identical frame counts (77535 each) - close
# enough that a simple frame-position pairing already amounts to a nearest-timestamp pairing here
# (see dataset_pamir.py's PamirBagsMixin.create_rgb_folder). Kept as its own dataset, separate
# from the mono-only pamir (2025_Pamir_1/2025_Pamir_2) dives, because VSLAM-LAB's modes: list
# applies dataset-wide - see dataset_pamir.yaml's sequence_names comment for why.
sequence_names:
  - 2024_OnRig

about:
  license: License
  summary: Multi-session visual-inertial SLAM dataset of the Pamir shipwreck (Barbados), captured with action cameras and IMU across three scuba dives
  homepage: https://huggingface.co/datasets/afrl-uw/Pamir_Visual-Inertial_Data
  authors:
    - Michalis Chatzispyrou
    - Luke Horgan
    - Hyunkil Hwang
    - Harish Sathishchandra
    - Chinmay Burgul
    - Monika Roznere
    - Alberto Quattrini Li
    - Philippos Mordohai
    - Ioannis Rekleitis

