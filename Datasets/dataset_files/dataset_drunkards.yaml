dataset_name: drunkards

rgb_hz: 30.0
modes: ['mono', 'rgbd']
cam_models: ['pinhole']
raw_formats: ['zip']

google_drive_link: 'https://drive.google.com/drive/folders/1AZHUKMbe7bR1xwRmAAZ0AHgcEqRnNjms?usp=sharing'
depth_factor: 2184.5 # Depth in meters = depth_value / depth_factor (pixel / (2**16 - 1) * 30, verified against a real downloaded depth frame)

# Only the 1024x1024 sequences (bigger than 640x480 by pixel area) are actually resized to this -
# the 320x320 sequences are already smaller and are copied unresized. See dataset_drunkards.py's
# create_rgb_folder/create_calibration_yaml for the per-sequence resize decision.
target_resolution: [640, 480]

