dataset_name: blt

# Front ZED2 colour rate, as configured in the paper's sensor table and as measured on the real
# ktima_2022_09_15 bag: 14.93 Hz over 748 frames, median frame gap 67.0 ms. Depth is recorded
# more slowly (10.27 Hz there) and is associated per frame in create_rgb_csv. Only written to
# calibration.yaml as `fps` - rgb.csv carries each frame's own header stamp, never a synthesized
# rate.
rgb_hz: 15.0

# Front ZED2 only: rectified colour (rgb_0) plus the republished depth stream (depth_0). The
# side-facing ZED2 is a second, independently-pointed camera rather than the other half of a
# stereo pair, so it is not exposed as `stereo`; the 40 Hz RSX-UM7 IMU is recorded too but is not
# extracted here, so no `-vi` mode is advertised.
modes: ['mono', 'rgbd']

# /front/zed_node/rgb/image_rect_color is rectified by the ZED SDK before recording and its
# CameraInfo carries an all-zero distortion vector, so calibration.yaml writes a plain pinhole
# camera with no distortion coefficients at all. Measured on ktima_2022_09_15: one single
# CameraInfo across all 1476 messages of the scanned window, fx = fy = 1057.0009,
# (cx, cy) = (952.2302, 553.5770) at 1920x1080, D = [0, 0, 0, 0, 0], and the depth stream's own
# CameraInfo identical to it (depth is registered to the colour frame). create_calibration_yaml
# still reads it per sequence rather than hardcoding it.
cam_models: ['pinhole']

raw_formats: ['ros1']

# One ROS1 bag per recording session, delivered through the request form on the dataset page -
# there is no direct download URL, so every sequence is local: fetch the bags yourself, then
# either drop them under VSLAM-LAB-Benchmark/BLT/raw (the default when raw_data_path is empty,
# below) or point raw_data_path at wherever you keep them. The layout inside that folder does not
# matter: download_sequence_data searches it recursively for the bag whose file name carries the
# session's date (e.g. rosbag_compressed_2022-09-15-14-23-20.bag for ktima_2022_09_15), so the
# delivered NN_month/ folders work as-is and so does a flat dump of .bag files.
sequence_location: local
raw_data_path: ""

# Depth in meters = depth_value / depth_factor. depth_0 is written as 16-bit millimetres,
# whichever of compressedDepth's two payload encodings the bag carries (see
# _decode_compressed_depth in dataset_blt.py).
depth_factor: 1000.0

target_resolution: [640, 480]

# One sequence per recording session at the Ktima Gerovassiliou vineyard, named after its date:
# the 11 sessions of the 2022 campaign listed on the dataset page (23 March; 6 and 20 April; 6 and
# 18 May; 1, 8, 22 and 29 June; 13 July; 15 September). The five 2023 Riseholme sessions are not
# included: two of them carry no RGB-D data at all, and `modes` applies dataset-wide, so they
# would belong to a separate dataset rather than this one.
sequence_names:
  - ktima_2022_03_23
  - ktima_2022_04_06
  - ktima_2022_04_20
  - ktima_2022_05_06
  - ktima_2022_05_18
  - ktima_2022_06_01
  - ktima_2022_06_08
  - ktima_2022_06_22
  - ktima_2022_06_29
  - ktima_2022_07_13
  - ktima_2022_09_15

