dataset_name: aria-digital-twin

rgb_hz: 30.0
modes: ['mono', 'mono-vi', 'stereo', 'stereo-vi', 'rgbd', 'rgbd-vi']
cam_models: ['pinhole']
raw_formats: ['vrs']

# ADT requires signing a non-commercial license agreement on the dataset's website, then fetching
# a per-user CDN links file (expires ~14 days) from ADT's own download page - that first step
# isn't automatable from here. Once you have that file, download_sequence_data drives the official
# `aria_dataset_downloader` CLI (projectaria_tools) with it automatically. Sequences land at
# VSLAM-LAB-Benchmark/ARIA_DIGITAL_TWIN/<sequence_name>/ (the raw video.vrs/depth_images.vrs/
# aria_trajectory.csv/... files, exactly as the downloader tool writes them).
sequence_location: local

# Path to your per-user CDN links file, resolved relative to VSLAM-LAB-Benchmark/ARIA_DIGITAL_TWIN/
# (never a path outside the benchmark dir - keeps this repo-portable and matches every other
# dataset's convention of treating VSLAM-LAB-Benchmark as the one place local/user-supplied data
# lives). Get yours from https://www.projectaria.com/datasets/adt/ after signing the license
# agreement, then place it at that path. Re-fetch it whenever it expires (~14 days) or a sequence
# below returns a stale-link warning.
cdn_urls_file: ADT_download_urls.json

# rgb_0/rgb_1 are the SLAM stereo pair (camera-slam-left/camera-slam-right, hardware-synced, the
# only true calibrated stereo pair on an Aria device), rectified from FISHEYE624 to a virtual
# pinhole camera. The Aria device's SLAM cameras are mounted physically rotated 90 deg, so the
# rectified pinhole image is additionally rotated upright (90 deg CW, matching projectaria_tools'
# own rotate_upright_image_and_calibration convention) before being saved - this target_resolution
# is that final on-disk/calibration.yaml size (portrait: narrower than tall), not the intermediate
# landscape pinhole grid used internally to sample the fisheye image. depth_0 is ground-truth depth
# aligned to rgb_0 (camera-slam-left), rectified and rotated the same way with nearest-neighbor
# sampling. The color camera-rgb stream is not used, since VSLAM-LAB's single rgb_0/rgb_1/depth_0
# layout is shared across every mode and camera-rgb has no stereo partner.
target_resolution: [480, 640]

# Depth pixel values in depth_images.vrs are millimeters; meters = raw / depth_factor.
depth_factor: 1000.0

# adt_segmentation_0/adt_segmentation_1 hold ADT's own per-instance ground-truth segmentation
# (segmentations.vrs), rectified the same way as rgb_0/rgb_1 and reduced to a binary static(1)/
# dynamic(0) mask per pixel using each instance's own MotionType label (STATIC/DYNAMIC) - not a
# class-name heuristic like Datasets/extra-files/mask2former.py. Same file convention as that
# script's mask2former_<i> output (uint8 "L" PNG, 1=static/0=dynamic, one file per rgb_<i> frame),
# so ts_mask_<i>/path_mask_<i> columns are written straight into rgb.csv - 'segmentation: mask2former'
# should not be set for this dataset in an experiment, since Run/run_functions.py would otherwise
# try to overwrite these columns by running the real Mask2Former model.
#
# Known ADT limitation, kept as-is rather than worked around: the human/skeleton instance's hand
# silhouette in this mask is a rigid rig bolted onto the (correctly tracked) wrist, not per-frame
# articulated - ADT's bodysuit mocap has no working finger tracking for these captures, despite
# instances.json/the skeleton joint schema listing 45 individual finger joints. Confirmed by
# comparing every finger joint's distance from the wrist across 5 timestamps spanning a full
# 127s sequence (Apartment_release_meal_skeleton_seq131_M1292): identical to sub-millimeter
# precision throughout, i.e. the fingers never move relative to the wrist even during 2 minutes of
# hands-on meal prep. So the hand/fingers in this mask reliably cover the right neighborhood (they
# move rigidly with the correctly-tracked wrist/arm) but not the right shape - fine for a
# conservative "don't map points here" dynamic filter, not for anything needing true finger pose.

sequence_names:
  - Apartment_release_clean_seq131_M1292
  - Apartment_release_clean_seq133_M1292
