  license: Aria Digital Twin Dataset License Agreement (custom, non-commercial research use only, no redistribution)
  summary: Aria Digital Twin (ADT) - egocentric dataset captured with Meta's Project Aria glasses in real indoor scenes, with photorealistic simulated ground truth for device trajectory, depth, segmentation, and 3D object/human poses
  homepage: https://www.projectaria.com/datasets/adt/
  features:
    - Real
    - Indoor
    - Headmounted
  authors:
    - Xiaqing Pan
    - Nicholas Charron
    - Yongqian Yang
    - Scott Peters
    - Thomas Whelan
    - Chen Kong
    - Omkar Parkhi
    - Richard Newcombe
    - Carl Yuheng Ren
  access: Registration Required
  publication: "Aria Digital Twin: A New Benchmark Dataset for Egocentric 3D Machine Perception"
  publication_url: "https://arxiv.org/abs/2306.06362"
  year: 2023
  bibtex_key: pan2023aria
  bibtex: |
