dataset_name: vector

rgb_hz: 30.0
imu_hz: 200.0
modes: ['mono', 'stereo', 'mono-vi', 'stereo-vi']
cam_models: ['radtan4']
raw_formats: ['zip']

# Event-camera streams (Prophesee stereo), the RGB-D depth stream (Azure Kinect, small-scale
# sequences only), and the LiDAR stream (Ouster, large-scale sequences only) are real parts of
# this dataset but are permanently out of scope here: no VSLAM-LAB baseline consumes event/LiDAR
# data, and a correct rgbd mode would require reprojecting the Kinect depth map into the left
# camera's frame via its own extrinsics/intrinsics (backproject -> transform -> project ->
# z-buffer) - no such reprojection utility exists anywhere in this repo, and building one was
# judged out of scope for this integration (see issue filed in step 9). Only the two regular
# (grayscale, global-shutter) stereo cameras, the IMU, and ground truth are fetched/used.

# Present purely so generate_dataset_table.py's field-presence check (_download_labels) classifies
# this dataset as google-drive rather than other - VECtor has no single shared root folder to crawl
# (unlike dataset_hilti2026.py/dataset_drunkards.py), only individually-shared per-file links, so
# google_drive_files below (not this field) is what dataset_vector.py's download_sequence_data
# actually reads. Points at one real, live drive.google.com share link (board-slow's left_camera.zip).
google_drive_link: "https://drive.google.com/file/d/1HBsDz7RrQFTGSHluQNsCjGlJHrhxoqXk/view?usp=sharing"

# Per-sequence Google Drive file IDs (share links, not a crawlable folder - VECtor publishes each
# stream of each sequence as an individually-shared Drive file). Extracted directly from the
# official download page's rendered HTML (https://star-datasets.github.io/vector/download/), zip
# variant (not rosbag) for left/right camera, txt variant (not rosbag) for imu/ground_truth - all
# 72 ids cross-checked as unique. Confirmed against a live download (board-slow's imu/ground_truth)
# that these ids resolve to the documented plain-text formats.
