dataset_name: endomapper

# EndoMapper videos are 1440x1080 at 40 fps (Epiphan frame grabber; the paper also lists 50 fps
# Magewell captures). Nominal rate: rgb.csv derives every timestamp from the video frame index
# and the frame rate read from the .mov itself (Seq_001: exactly 40/1), so a 50 fps procedure
# gets 20 ms steps regardless of this value.
rgb_hz: 40.0
modes: ['mono']
# Official EndoMapper calibration: Kannala-Brandt (calibu "fu fv u0 v0 kb4" = fx, fy, cx, cy,
# k1..k4), one file per endoscope, at the native 1440x1080 and rescaled to target_resolution.
# 17 procedures have no endoscope recorded ("N/A" in their info json and in Dataset Summary.xlsx)
# and get an 'unknown' camera entry (zero intrinsics) instead.
cam_models: ['equid4', 'unknown']
# video: rgb_0 is extracted from the procedure's H.264 .mov; colmap: the poses come from the
# COLMAP sub-models shipped as meta-data for Seq_001/Seq_002 (a zip of sparse/<M>/*.bin).
raw_formats: ['video', 'colmap']

# Hosted on Synapse (project syn26707219) behind registration + access conditions. Files are
# fetched on demand with synapseclient - credentials via its own ~/.synapseConfig or the
# SYNAPSE_AUTH_TOKEN env var, never a yaml field - into raw_data_path, which mirrors the project's
# own layout and doubles as an offline cache (anything already there is used as-is, no login):
#   Sequences/Seq_<NNN>/Seq_<NNN>.mov                  the procedure video (H.264, 7 Mbps)
#   Sequences/Seq_<NNN>/Seq_<NNN>_info.json            {"seq_number", "endoscope_number", "type", "meta-data"}
#   Sequences/Seq_<NNN>/meta-data/colmap/Seq_<NNN>.zip COLMAP export (Seq_001/Seq_002 only): one
#                                                      top-level folder (Seq_001: "33/") with
#                                                      sparse/<M>/{cameras,images,points3D}.bin per
#                                                      sub-model M, cluster_list/<M>.txt, GT/<M>.txt
#                                                      (retrieval positives, ignored) and img_train/
#                                                      (the registered frames as PNG, unused - rgb_0
#                                                      comes from the video)
#   Calibrations/Endoscope_<NN>/Endoscope_<NN>_geometrical.xml   that endoscope's calibration
# download_sequence_data symlinks the video to VSLAM-LAB-Benchmark/ENDOMAPPER/<sequence>/raw.mov,
# copies the info json + geometrical xml next to it and extracts the sequence's images.bin.
api_url: https://www.synapse.org/Synapse:syn26707219
synapse_project_id: syn26707219
raw_data_path: /home/alejandro/VSLAM-LAB-Benchmark/Endomapper_raw

target_resolution: [640, 480]

# Seq_<NNN>: one complete procedure (93 on Synapse: 001-096 minus 082/084/086; 72 colonoscopies,
# 21 gastroscopies), every video frame in rgb_0 (Seq_001: 14760 frames, 6 min 9 s). groundtruth.csv
# holds COLMAP poses only for Seq_001/Seq_002 - from their *largest* sub-model (Seq_001: sub-model
# 11), on the frames it registered (camera-in-world, that sub-model's own arbitrary frame and
# scale; poses from different sub-models don't share a frame, so no other cluster can be merged
# in) - and is header-only for the other 91.
# Seq_<NNN>_<MM>: sub-model MM of Seq_001/Seq_002 (50 each) as a *continuous* clip - every video
# frame from the sub-model's first to its last registered frame (the COLMAP export itself skips
# the frames COLMAP dropped) - with poses on the registered frames. Seq_001's sub-models span 14
# to 953 registered frames; nine pairs overlap in time. COLMAP's frame names out<N>.png are
# 1-based video frame numbers (verified pixel-wise against the .mov: out<N> == frame N-1), so
# rgb_0's 0-based <N-1>.png carries pose out<N>.
sequence_names:
  - Seq_001
  - Seq_002
  - Seq_003
  - Seq_004
