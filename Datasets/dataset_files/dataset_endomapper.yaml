dataset_name: endomapper

# EndoMapper videos are 1440x1080 at 40 fps (Epiphan frame grabber; the paper also lists 50 fps
# Magewell captures for other procedures - Seq_001's COLMAP project folder is "40fps_HCULB"). No
# timestamps ship with the frames: rgb.csv derives each frame's time from its video frame index
# (out<N>.png -> N / rgb_hz).
rgb_hz: 40.0
modes: ['mono']
# Official EndoMapper calibration: Kannala-Brandt (calibu "fu fv u0 v0 kb4" = fx, fy, cx, cy,
# k1..k4), one file per endoscope, at the native 1440x1080 and rescaled to target_resolution.
cam_models: ['equid4']
raw_formats: ['zip', 'colmap']

# All sequences are local - there is no remote source wired up. raw_data_path is the entry point:
# a folder mirroring the Synapse project's layout,
#   Sequences/Seq_<NNN>.zip            the COLMAP retrieval-training export of that procedure (see
#                                      below), a single top-level folder (Seq_001: "33/") with
#                                      img_train/out<N>.png (the video frames COLMAP registered,
#                                      1440x1080), sparse/<M>/{cameras,images,points3D}.bin (one
#                                      COLMAP sub-model per cluster M), cluster_list/<M>.txt (the
#                                      frames of cluster M) and GT/<M>.txt (image-retrieval
#                                      positives - not poses, ignored here)
#   Sequences/Seq_<NNN>_info.json      {"seq_number", "endoscope_number", "type", ...}
#   Calibrations/Endoscope_<NN>/Endoscope_<NN>_geometrical.xml    that endoscope's Kannala-Brandt
#                                      calibration (the *_photometrical.xml next to it is unused)
#   Simulated Sequences/               synthetic colon sequences - a different dataset (pinhole,
#                                      rgbd, metric trajectory), not part of this one
# download_sequence_data symlinks the zip to VSLAM-LAB-Benchmark/ENDOMAPPER/<sequence>/raw.zip,
# copies the info json + geometrical xml next to it and extracts the sequence's images.bin; the
# create_* hooks read the frames straight out of the zip through that link.
sequence_location: local
raw_data_path: /home/alejandro/VSLAM-LAB-Benchmark/Endomapper_raw

target_resolution: [640, 480]

# Seq_<NNN>_<MM>: COLMAP sub-model MM of procedure NNN - rgb_0 holds exactly the frames registered
# in sparse/MM/images.bin (a mostly-consecutive stretch of the video, occasionally with gaps), and
# groundtruth.csv their COLMAP poses (camera-in-world, that sub-model's own arbitrary frame and
# scale). Seq_001 has 50 sub-models of 14 to 953 frames; nine pairs overlap in time.
# Seq_<NNN>: the whole procedure export - rgb_0 holds every img_train frame in video order (5809
# for Seq_001, video indices 1328..14809 with long gaps between clusters), and groundtruth.csv the
# poses of the *largest* sub-model only (Seq_001: sub-model 11, 953 frames) - poses from different
# sub-models don't share a frame, so no other cluster's poses can be merged in.
sequence_names:
  - Seq_001
  - Seq_001_00
  - Seq_001_01
  - Seq_001_02
  - Seq_001_03
  - Seq_001_04
