dataset_name: replica

rgb_hz: 30.0
modes: ['mono', 'rgbd']
cam_models: ['pinhole']

url_download_root: "https://cvg-data.inf.ethz.ch/nice-slam/data/Replica.zip"
depth_factor: 6553.5 # Depth in meters = depth_value / depth_factor

sequence_names:
  - office0
  - office1
  - office2
  - office3
  - office4
  - room0
  - room1
  - room2

