dataset_name: tartanair-train

rgb_hz: 30.0
modes: ['mono', 'stereo', 'rgbd']
cam_models: ['pinhole']
raw_formats: ['zip']

hf_repo_id: 'theairlabcmu/tartanair'

depth_factor: 100.0 # Depth in meters = depth_value / depth_factor

