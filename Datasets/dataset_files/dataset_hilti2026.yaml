dataset_name: hilti2026

rgb_hz: 30.0
modes: ['mono', 'mono-vi']
cam_models: ['equid4']
raw_formats: ['ros2']

# Root of the official challenge dataset folder (confirmed via the challenge repo's own
# challenge_tools_ros/download_data/download_drive.py, DEFAULT_FOLDER_ID). Individual sequences
# are resolved from a cached manifest crawled from this folder in __init__/download_sequence_data
# - not a hand-maintained per-sequence folder-ID map (the old implementation's map was checked
# against the 5 sequence folder links the README itself publishes and matched 0 of 5 - it looked
# fabricated/stale).
google_drive_link: "https://drive.google.com/drive/folders/1BWFIfEL40Nvj-yeyre5O9dOiYCTWatv5"

target_resolution: [640, 480]

