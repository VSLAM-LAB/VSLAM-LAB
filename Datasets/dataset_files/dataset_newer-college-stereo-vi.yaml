dataset_name: newer-college-stereo-vi

rgb_hz: 30.0
imu_hz: 250.0
modes: ['mono', 'mono-vi', 'stereo', 'stereo-vi']
cam_models: ['radtan4']
raw_formats: ['zip', 'ros1']

# The whole Newer College Dataset (2020 stereo-inertial + 2021 multi-cam collections) lives in one
# shared Google Drive folder; this link is the official share link from
# https://ori-drs.github.io/newer-college-dataset/download/. Present so
# generate_dataset_table.py's field-presence check (_download_labels) classifies this dataset as
# google-drive; what download_sequence_data actually reads is google_drive_files below (the folder
# isn't crawled at runtime - per-file ids are pinned here instead, same pattern as
# dataset_vector.yaml).
google_drive_link: "https://drive.google.com/drive/folders/15lTH5osZzZlDpcW7oXfR_2t8TNssNARS?usp=sharing"

# Dataset-wide calibration files (2020-ouster-os1-64-realsense/04_calibration/kalibr_output/...):
# one Kalibr cam-IMU camchain (intrinsics + T_cam_imu for both infra cameras) and the D435i IMU
# noise yaml, shared by every sequence in this collection.
calibration_files:
  camchain_imucam: "1WZtKOZ_yeVl8ra_wu8l2YeONhQrfmcqm"  # camchain-realsense_imu-cam-rooster_2020-03-11-10-05-35_0.yaml
  imu_noise: "1vP0hPnuLE5oYrzDjetS6tUgIsM5-At7p"        # imu.yaml (D435i noise densities)

# Per-sequence Google Drive file ids, extracted from the official Drive folder's own structure
# (2020-ouster-os1-64-realsense/<NN>_<sequence>/...). short_experiment is the only sequence the
# dataset publishes in raw_format (per-camera image zips + an EuRoC-style IMU csv); every other
# sequence only ships full sensor rosbags (which also carry the unused Ouster lidar streams -
# nothing lighter exists upstream). ground_truth is registered_poses.csv (BLK360 prior-map ICP,
# poses of the left camera frame RS_C1); time_offsets is the per-sequence camera-vs-lidar clock
# offset log (long_experiment ships none upstream).
google_drive_files:
  short_experiment:
    infra1_zips:
      - "1-ZMksOXFNLcmrqt-yfLp6IMRKfA-IHiz"  # infra1_01.zip
      - "1MQ4cRK8ZWehPaa8vjigUr7KPIidqV5Md"  # infra1_02.zip
      - "1SRq2OSWAHiKSjyePKNRIjXQJxM-bk0-l"  # infra1_03.zip
