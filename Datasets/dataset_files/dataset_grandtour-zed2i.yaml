dataset_name: grandtour-zed2i

# Stereolabs ZED2i color stereo pair (zed2i_left_images / zed2i_right_images: 1920x1080, rolling
# shutter, 15 Hz). The ZED2i IMU is not part of the Hugging Face release, so no -vi modes; the
# ZED2i depth maps are expressed in a rectified frame with different intrinsics than the raw right
# image, so rgbd is left out too. The sibling grandtour-alphasense dataset exposes the Alphasense
# monochrome stereo pair + IMU of the same missions.
rgb_hz: 15.0
modes: ['mono', 'stereo']
cam_models: ['radtan4']
raw_formats: ['tar']

hf_repo_id: "leggedrobotics/grand_tour_dataset"

target_resolution: [640, 480]

# Sequence names are the paper's mission tags (lower-cased, ASCII, underscore). The mapping to the
# Hugging Face mission folders (JJJJ-MM-DD-hh-mm-ss) lives in dataset_grandtour.py's MISSIONS dict.
# RIV-1 (2024-11-04-16-52-38) is omitted (no sensor streams on Hugging Face) and so is HIL-1
# (2024-11-04-16-05-00), whose release has no ZED2i streams.
sequence_names:
  - eth_1
  - eth_2
  - eth_3
  - spx_1
  - spx_2
  - spx_3
  - ice_1
  - snow_1
  - snow_2
  - snow_3
  - eig_1
  - eig_2
  - gri_1
  - cyn_1
  - cyn_2
  - pil_1
  - pil_2
  - root_1
  - haus_1
  - hoeb_1
  - hoeb_2
  - heap_1
  - kaeb_1
  - kaeb_2
  - kaeb_3
  - trim_1
  - alb_1
  - alb_2
  - alb_3
  - lmb_1
  - lmb_2
  - lee_1
  - arc_1
  - arc_2
  - arc_3
  - arc_4
  - arc_5
  - arc_6
  - arc_7
  - leica_1
  - leica_2
  - sbb_1
  - sbb_2
  - con_1
  - con_2
  - con_3
  - con_4

