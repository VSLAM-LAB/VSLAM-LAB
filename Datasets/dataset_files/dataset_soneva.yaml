dataset_name: soneva

rgb_hz: 2.0
modes: ['mono']
cam_models: ['pinhole']
raw_formats: ['images', 'colmap']

hf_repo_id: "wildflow/soneva-corals"
target_resolution: [640, 480]

# <plot>_<yyyymmdd>: one survey of the two-GoPro rig, as two independent monocular streams - rgb_0
# (LHS camera; what 'mono' runs on) plus rgb_1 (RHS camera) with its own rgb_1.csv, calibration
# entry and groundtruth_1.csv. Not a stereo pair: unsynchronized shutters, no rig extrinsics.
# <plot>_<yyyymmdd>_comb: the same survey with both cameras merged into one denser rgb_0 (RHS frames
# warped into the rgb_0 intrinsics, both cropped to their common canvas, interleaved by a
# groundtruth-estimated shutter offset) with a single rgb.csv / groundtruth.csv and the rgb_0
# camera's calibration. Requesting a *_comb sequence pulls in (downloads/processes) its base survey.
