dataset_name: endomapper-sim

# VR-Caps renders at 30 fps (trajectory.csv's time column steps by 1/30 s). No timestamps ship
# with the frames: rgb.csv derives each frame's time from its index (image_<N>.png -> N / rgb_hz).
rgb_hz: 30.0
modes: ['mono', 'rgbd']
# calibration.txt in each sequence: fx, fy, cx, cy at 960x720, no distortion (a rendered pinhole).
cam_models: ['pinhole']
raw_formats: ['images']

# Hosted on Synapse (project syn26707219, folder "Simulated Sequences"), behind registration +
# access conditions. Each Seq_<N> folder is fetched on demand with synapseclient - credentials via
# its own ~/.synapseConfig or the SYNAPSE_AUTH_TOKEN env var, never a yaml field - into a mirror of
# the project's own layout inside the dataset folder, VSLAM-LAB-Benchmark/ENDOMAPPER-SIM/, which
# doubles as an offline cache (a complete folder already there is used as-is, no login):
#   Simulated Sequences/Seq_<N>/rgb/image_<NNNN>.png          960x720 RGBA renders
#   Simulated Sequences/Seq_<N>/depth/aov_image_<NNNN>.exr    float depth, one channel
#   Simulated Sequences/Seq_<N>/{calibration,info,rgb,depth}.txt, trajectory.csv
# download_sequence_data symlinks that folder to <sequence>/raw (relative); the create_* hooks read
# through the link.
api_url: https://www.synapse.org/Synapse:syn26707219
synapse_project_id: syn26707219

# Depth in meters = depth_0 pixel value / depth_factor. The EXRs store depth in decimeters
# (info.txt: "Depth image metric unities: dm"), quantized to multiples of 1/16384 dm, so
# 163840 px/m (= 16384 px/dm) keeps every source value exact (max 0.4 m in uint16). Caveat (#152):
# the values only span 0.003-0.10 dm (0.3 mm - 1 cm) in Seq_0, which looks small for a colon
# lumen - if they turn out to be meters, set this to 16384 and reprocess; the trajectory is in dm
# too (same info.txt) and is converted to m in create_groundtruth_csv.
depth_factor: 163840.0

target_resolution: [640, 480]

# Seq_<N>: one simulated colon flythrough of a CT-derived colon model, 261-335 frames each
# (Dataset Summary.xlsx), same endoscope trajectory rendered with increasingly aggressive
# deformation (info.txt gives the amplitude/speed; Seq_0 is rigid). Only frames that have both an
# RGB image and a depth map are kept (rgbd needs the 1:1 pairing).
sequence_names:
  - Seq_0
  - Seq_1
  - Seq_2
  - Seq_3
  - Seq_4
  - Seq_5

