[workspace]
authors = ["vslamlab <vslamlab@gmail.com>"]
channels = ["https://prefix.dev/conda-forge"]
name = "lietorch"
platforms = [
    { name = "linux-64-cuda126", platform = "linux-64", cuda = "12.6" },
    { name = "linux-64-cuda129", platform = "linux-64", cuda = "12.9" },
]
version = "0.1.0"
preview = ["pixi-build"]
build-variants-files = ["variants.yaml"]  # CUDA variants (needs zip_keys, which the inline table lacks)

# One package build per value (combined with the CUDA variants in variants.yaml)
[workspace.build-variants]
python = ["3.11.*"]

########################################################################################################################
# Package: `pixi build` -> .conda, `pixi publish --to https://prefix.dev/vslamlab/vslamlab`
[package]
name = "lietorch"
version = "1.0.1"
description = "The LieTorch library generalizes PyTorch to 3D transformation groups."
authors = ["Zachary Teed", "Jia Deng"]
license = "BSD-3-Clause"
homepage = "https://github.com/princeton-vl/lietorch"
repository = "https://github.com/VSLAM-LAB/lietorch"

[package.build]
backend = { name = "pixi-build-python", version = "0.*" }
source = { git = "https://github.com/VSLAM-LAB/lietorch", rev = "bf1bcfe366501856ef5e1e4a6df6c6e27b561e4a" }

[package.build.config]
noarch = false                    # compiled CUDA extension
compilers = ["c", "cxx", "cuda"]
installer = "pip"
env = { TORCH_CUDA_ARCH_LIST = "7.0;7.5;8.0;8.6;8.9;9.0+PTX" }  # else nvcc targets only the build machine's GPU

[package.build-dependencies]
ninja = "*"

[package.host-dependencies]
python = "*"
pip = "*"
setuptools = "*"
pytorch-gpu = "2.7.*"   # keep equal to the run pin below
cuda-version = "*"      # set per build by cuda_version in variants.yaml
cuda-cudart-dev = "*"   # the extensions link libcudart only
libcublas-dev = "*"     # headers pulled in by ATen/cuda/CUDAContext.h
libcusparse-dev = "*"
libcusolver-dev = "*"

[package.run-dependencies]
python = "*"
pytorch-gpu = "2.7.*"   # the extensions are compiled against this torch ABI
scipy = "*"
pyyaml = "*"

########################################################################################################################
# Workspace: installs the built package, for `pixi run test`
[tasks]
test = "python -I -c 'import lietorch; print(lietorch.SE3)'"  # -I: the source clone in ./lietorch would shadow the package

[dependencies]
lietorch = { path = "." }  # its run-dependencies bring python, pytorch-gpu, scipy, pyyaml

# One test environment per CUDA build: `pixi run -e cu126 test`, `pixi run -e cu129 test`
[feature.cu126.dependencies]
cuda-version = "12.6.*"

[feature.cu129.dependencies]
cuda-version = "12.9.*"

[environments]
cu126 = ["cu126"]
cu129 = ["cu129"]
