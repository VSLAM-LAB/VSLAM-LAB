# One lietorch build per CUDA version. zip_keys pairs nvcc with the host cuda-version, otherwise the
# 12.6 build would solve its host env (and pytorch) against the newest cuda-version that nvcc allows (12.9).
cuda_compiler_version:
  - "12.6"
  - "12.9"
cuda_version:
  - "12.6"
  - "12.9"
zip_keys:
  - [cuda_compiler_version, cuda_version]
