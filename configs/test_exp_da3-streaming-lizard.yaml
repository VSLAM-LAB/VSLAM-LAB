# Controls for the exp_debug lizard-island run
# 1. same range, consecutive frames (0.5 s apart instead of 2.5 s)
test_da3s_lizard_step1:
  Config: config_lirs_feb24_gp1.yaml
  NumRuns: 1
  Parameters: {verbose: 0, mode: mono, rgb_idx: [1000,1999], rgb_step: 1, rgb_max: 200, refraction: refrax, chunk_size: 30, overlap: 15}
  Module: da3-streaming

# 2. the exp_debug spacing (step 5) without loop closure
test_da3s_lizard_step5_noloop:
  Config: config_lirs_feb24_gp1.yaml
  NumRuns: 1
  Parameters: {verbose: 0, mode: mono, rgb_idx: [1000,1999], rgb_step: 5, rgb_max: 200, refraction: refrax, chunk_size: 30, overlap: 15, loop_enable: 0}
  Module: da3-streaming
