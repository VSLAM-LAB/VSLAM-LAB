test_exp_mapanything:
  Config: test_config_vggtslam.yaml
  NumRuns: 1
  Parameters: {verbose: 0, mode: mono}
  Module: mapanything

test_exp_mapanything_calib:
  Config: test_config_vggtslam.yaml
  NumRuns: 1
  Parameters: {verbose: 0, mode: mono, use_calibration: 1}
  Module: mapanything

test_exp_mapanything_rgbd:
  Config: test_config_vggtslam.yaml
  NumRuns: 1
  Parameters: {verbose: 0, mode: rgbd}
  Module: mapanything

# External models through MapAnything's model factory (mono, images only)
test_exp_mapanything_vggt:
  Config: test_config_vggtslam.yaml
  NumRuns: 1
  Parameters: {verbose: 0, mode: mono, module: vggt, rgb_max: 40}
  Module: mapanything

test_exp_mapanything_vggt_bf16:
  Config: test_config_vggtslam.yaml
  NumRuns: 1
  Parameters: {verbose: 0, mode: mono, module: vggt, precision: bf16, rgb_max: 80}
  Module: mapanything

test_exp_mapanything_vggt-omega:
  Config: test_config_vggtslam.yaml
  NumRuns: 1
