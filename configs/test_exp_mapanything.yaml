  Module: mapanything

test_exp_mapanything_pi3:
  Config: test_config_vggtslam.yaml
  NumRuns: 1
  Parameters: {verbose: 0, mode: mono, module: pi3, rgb_max: 40}
  Module: mapanything

test_exp_mapanything_dust3r:
  Config: test_config_vggtslam.yaml
  NumRuns: 1
  Parameters: {verbose: 0, mode: mono, module: dust3r, rgb_max: 20, scene_graph: swin-5}
